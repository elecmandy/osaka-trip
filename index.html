<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大阪五日遊行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#eaf6fb;
    --bg-bottom:#fbfeff;
    --card-bg:#ffffff;
    --ocean:#2e86ab;
    --ocean-deep:#1f6d8c;
    --navy:#123c55;
    --slate:#4a6572;
    --sky-line:#cfe9f3;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--slate);
    background:linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 420px);
    font-size:17px;
    line-height:1.7;
  }

  .page{
    max-width:800px;
    margin:0 auto;
  }

  /* ---------- Hero ---------- */
  .hero{
    background:linear-gradient(135deg, var(--ocean-deep), var(--ocean));
    color:#ffffff;
    text-align:center;
    padding:4.5rem 1.5rem 5.5rem;
    position:relative;
  }

  .hero h1{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:clamp(2.2rem, 5vw, 3.1rem);
    margin:0 0 0.8rem;
    letter-spacing:0.02em;
  }

  .hero p{
    font-size:1.15rem;
    margin:0;
    color:#dff3fb;
    font-weight:400;
  }

  .hero-wave{
    display:block;
    width:100%;
    height:70px;
    margin-bottom:-1px;
  }

  /* ---------- Timeline / Cards ---------- */
  main.timeline{
    position:relative;
    padding:1rem 1.5rem 3rem;
  }

  main.timeline::before{
    content:"";
    position:absolute;
    top:0.5rem;
    bottom:2rem;
    left:calc(1.5rem + 34px);
    border-left:2px dashed var(--sky-line);
  }

  .day-card{
    position:relative;
    display:flex;
    gap:1.5rem;
    align-items:flex-start;
    background:var(--card-bg);
    border:1px solid var(--sky-line);
    border-radius:14px;
    box-shadow:0 10px 24px rgba(46,134,171,0.10);
    padding:1.8rem 1.8rem;
    margin-bottom:2.2rem;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }

  .day-card:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 30px rgba(46,134,171,0.16);
  }

  .day-marker{
    flex:0 0 auto;
    width:68px;
    height:68px;
    border-radius:50%;
    background:#ffffff;
    border:2px solid var(--ocean);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:1;
  }

  .day-marker .day-num{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:1.5rem;
    color:var(--navy);
    line-height:1;
  }

  .day-marker .day-label{
    font-size:0.65rem;
    color:var(--ocean);
    letter-spacing:0.08em;
    margin-top:2px;
  }

  .day-content{
    flex:1 1 auto;
    min-width:0;
  }

  .day-meta{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    justify-content:space-between;
    gap:0.5rem;
    margin-bottom:0.6rem;
  }

  .day-title{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:1.5rem;
    color:var(--navy);
    margin:0;
  }

  .day-date{
    font-size:0.95rem;
    color:var(--ocean-deep);
    font-weight:500;
    white-space:nowrap;
  }

  .day-intro{
    margin:0;
    font-size:1.05rem;
    color:var(--slate);
  }

  /* ---------- Footer ---------- */
  .page-footer{
    text-align:center;
    padding:2rem 1.5rem 3.5rem;
    color:var(--ocean-deep);
    font-size:0.95rem;
  }

  .page-footer::before{
    content:"";
    display:block;
    width:60px;
    height:2px;
    background:var(--sky-line);
    margin:0 auto 1.2rem;
  }

  /* ---------- Responsive ---------- */
  @media (max-width:560px){
    .hero{ padding:3.5rem 1.2rem 4.5rem; }
    main.timeline{ padding:1rem 1rem 2.5rem; }
    main.timeline::before{ left:calc(1rem + 30px); }
    .day-card{
      flex-direction:column;
      align-items:center;
      text-align:center;
      padding:1.6rem 1.2rem;
    }
    .day-meta{
      flex-direction:column;
      align-items:center;
    }
  }
</style>
</head>
<body>

<div class="page">

  <header class="hero">
    <h1>大阪五日遊行程</h1>
    <p>五天四夜，慢慢走過這座城市</p>
    <svg class="hero-wave" viewBox="0 0 800 70" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,40 C150,80 350,0 500,30 C650,60 750,20 800,35 L800,70 L0,70 Z" fill="#eaf6fb"></path>
    </svg>
  </header>

  <main class="timeline">

    <section class="day-card">
      <div class="day-marker">
        <span class="day-num">01</span>
        <span class="day-label">DAY</span>
      </div>
      <div class="day-content">
        <div class="day-meta">
          <h2 class="day-title">〈第一天主題標題〉</h2>
          <span class="day-date">日期</span>
        </div>
        <p class="day-intro">在此填寫本日行程重點、景點與交通安排的簡短介紹文字。</p>
      </div>
    </section>

    <section class="day-card">
      <div class="day-marker">
        <span class="day-num">02</span>
        <span class="day-label">DAY</span>
      </div>
      <div class="day-content">
        <div class="day-meta">
          <h2 class="day-title">〈第二天主題標題〉</h2>
          <span class="day-date">日期</span>
        </div>
        <p class="day-intro">在此填寫本日行程重點、景點與交通安排的簡短介紹文字。</p>
      </div>
    </section>

    <section class="day-card">
      <div class="day-marker">
        <span class="day-num">03</span>
        <span class="day-label">DAY</span>
      </div>
      <div class="day-content">
        <div class="day-meta">
          <h2 class="day-title">〈第三天主題標題〉</h2>
          <span class="day-date">日期</span>
        </div>
        <p class="day-intro">在此填寫本日行程重點、景點與交通安排的簡短介紹文字。</p>
      </div>
    </section>

    <section class="day-card">
      <div class="day-marker">
        <span class="day-num">04</span>
        <span class="day-label">DAY</span>
      </div>
      <div class="day-content">
        <div class="day-meta">
          <h2 class="day-title">〈第四天主題標題〉</h2>
          <span class="day-date">日期</span>
        </div>
        <p class="day-intro">在此填寫本日行程重點、景點與交通安排的簡短介紹文字。</p>
      </div>
    </section>

    <section class="day-card">
      <div class="day-marker">
        <span class="day-num">05</span>
        <span class="day-label">DAY</span>
      </div>
      <div class="day-content">
        <div class="day-meta">
          <h2 class="day-title">〈第五天主題標題〉</h2>
          <span class="day-date">日期</span>
        </div>
        <p class="day-intro">在此填寫本日行程重點、景點與交通安排的簡短介紹文字。</p>
      </div>
    </section>

  </main>

  <footer class="page-footer">
    <p>祝你有個美好的大阪旅程</p>
  </footer>

</div>

</body>
</html>
